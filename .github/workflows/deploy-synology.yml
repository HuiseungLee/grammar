name: Deploy to Synology NAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grammar-synology-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy the latest main commit
        shell: bash
        env:
          # Current DDNS endpoint and independently verified NAS host key.
          NAS_HOST: foredu.synology.me
          NAS_PORT: "2202"
          NAS_HOST_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA++9n7ukVI2QHi4HCCk0Fmr7FD11Do7x0LBkc0B4uZx"
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$NAS_HOST"
          test -n "$NAS_PORT"
          test -n "$NAS_HOST_KEY"
          test -n "$NAS_USER"
          test -n "$NAS_SSH_KEY"

          ssh_dir="$RUNNER_TEMP/grammar-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$NAS_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          printf '[%s]:%s %s\n' "$NAS_HOST" "$NAS_PORT" "$NAS_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"

          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          test -s "$ssh_dir/known_hosts"
          ssh-keygen -F "[$NAS_HOST]:$NAS_PORT" -f "$ssh_dir/known_hosts" >/dev/null

          ssh -4 \
            -i "$ssh_dir/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -p "$NAS_PORT" \
            "$NAS_USER@$NAS_HOST" \
            'sudo -n /bin/sh /volume2/docker/grammar-app/scripts/synology-auto-deploy.sh || { echo "Retrying once after updating the deployment script." >&2; sudo -n /bin/sh /volume2/docker/grammar-app/scripts/synology-auto-deploy.sh; }'
