services:
  grammar-learning:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grammar-learning
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      GRAMMAR_ADMIN_PASSWORD: "${GRAMMAR_ADMIN_PASSWORD:-}"
      GRAMMAR_SESSION_SECRET: "${GRAMMAR_SESSION_SECRET:-}"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-}"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
      ACCOUNT_SERVICE_URL: "http://literature-ai:3000"
      TEACHER_EMAILS: "${TEACHER_EMAILS:-lhsstart@gmail.com,admin@admin.com}"
      STUDENT_EMAILS: "${STUDENT_EMAILS:-stu01@st.com}"
    ports:
      - "127.0.0.1:${GRAMMAR_PORT:-7320}:3000"
    volumes:
      - grammar-learning-data:/data
    networks:
      - lhsstart-auth

volumes:
  grammar-learning-data:

networks:
  lhsstart-auth:
    external: true
    name: lhsstart-shared
